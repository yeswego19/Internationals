<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перевод документов</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:system-ui;background:#0a0e1a;color:#e8eef7;margin:0;padding:2rem;max-width:700px;margin-inline:auto}
h1{color:#67b8ff}
.upload{border:2px dashed #4a90e2;padding:2rem;text-align:center;border-radius:12px;cursor:pointer;margin-bottom:1rem}
select,button{padding:.6rem 1rem;margin:.3rem;border-radius:6px;border:0}
button{background:#4a90e2;color:#fff;cursor:pointer}
#result{background:#111827;padding:1rem;border-radius:8px;white-space:pre-wrap;min-height:120px;margin-top:1rem}
</style>
</head>
<body>
<h1>Перевод документов</h1>

<div class="upload" onclick="fileInput.click()">
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  Выберите фото документов (можно несколько)
</div>

<label>Язык документа:
<select id="srcLang">
  <option value="eng">English</option>
  <option value="rus">Русский</option>
  <option value="chi_sim">中文</option>
  <option value="deu">Deutsch</option>
  <option value="fra">Français</option>
  <option value="spa">Español</option>
  <option value="ara">العربية</option>
</select>
</label>

<label>Перевести на:
<select id="tgtLang">
  <option value="ru">Русский</option>
  <option value="en">English</option>
  <option value="zh">中文</option>
  <option value="de">Deutsch</option>
</select>
</label>

<button onclick="process()">Распознать и перевести</button>
<div id="status"></div>
<div id="result"></div>

<div style="margin-top:1.5rem">
  <button class="cc-payment-button"></button>
</div>

<script defer src="https://cdn.trybit.com/widget/v1/widget.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
const result = document.getElementById('result');

async function process() {
  const files = fileInput.files;
  if (!files.length) { status.textContent = 'Выберите файлы'; return; }

  status.textContent = 'Распознаю...';
  result.textContent = '';
  let allText = '';

  for (const file of files) {
    const { data: { text } } = await Tesseract.recognize(file, document.getElementById('srcLang').value, {
      logger: m => status.textContent = m.status + ' ' + Math.round((m.progress||0)*100) + '%'
    });
    allText += text + '\n\n';
  }

  status.textContent = 'Перевожу...';
  // Простой перевод через Google (без ключа, лимиты есть)
  const tgt = document.getElementById('tgtLang').value;
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tgt}&dt=t&q=${encodeURIComponent(allText)}`;
  const res = await fetch(url);
  const data = await res.json();
  const translated = data[0].map(x => x[0]).join('');
  result.textContent = translated;
  status.textContent = 'Готово';
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.TryBitWidget) {
    window.TryBitWidget.CreateInvoiceButton({
      size: 'standard',
      template: 'variant1:white',
      text: 'Pay with crypto',
      amount: 8,
      currency: 'USD',
      shop_id: 'O4BDppG9by6PFohd',
      locale: 'ru'
    }).mount('.cc-payment-button');
  }
});
</script>
</body>
</html>
