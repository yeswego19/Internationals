<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Translation | Internationals</title>
    <meta name="description" content="Send us your translation request — email, subject, message and attachments.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.7">
    <style>
        body { background-color: #f4f7f9; }
        .header {
            padding: 40px 40px 10px 40px;
            display: flex;
            align-items: center;
            background: transparent;
        }
        .logo img { width: 280px; height: auto; display: block; }
        .wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }
        .action-bar { display: flex; justify-content: flex-end; margin-bottom: -10px; }
        .back-link {
            text-decoration: none;
            color: var(--primary);
            font-size: 75px;
            font-weight: bold;
            transition: color 0.3s ease;
            line-height: 0.8;
            cursor: pointer;
        }
        .back-link:hover { color: #ff0000; }
        .request-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .request-card h1 { margin-top: 0; color: var(--text); }
        .request-card p.subtitle { color: var(--text-sec); margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html" onclick="window.close();setTimeout(function(){window.location.href='index.html';},300);return false;">
                <img src="assets/logo.png" alt="Internationals" class="site-logo">
            </a>
        </div>
    </header>
    <div class="wrapper">
        <div class="action-bar">
            <a onclick="window.close();" class="back-link" title="Close">&larr;</a>
        </div>
        <div class="request-card">
            <h1>Request a Translation</h1>
            <p class="subtitle">Tell us what you need — we'll get back to you shortly.</p>
            <form id="contactForm" enctype="multipart/form-data">
                <div class="form-group"><input type="email" id="email" placeholder="Email" required></div>
                <div class="form-group"><input type="text" id="subject" placeholder="Subject" required></div>
                <div class="form-group"><textarea id="message" placeholder="Your message" rows="5" required></textarea></div>
                <div class="form-group"><input type="file" id="attachment" multiple></div>
                <button type="submit" class="btn btn-primary btn-full">Send message</button>
            </form>
        </div>
    </div>
</body>
</html>
