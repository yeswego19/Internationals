<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Translation | Internationals</title>
    <meta name="description" content="Send us your translation request — email, subject, message and attachments.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.7">
    <style>
        body { background-color: #f4f7f9; }
        .header {
            padding: 40px 40px 10px 40px;
            display: flex;
            align-items: center;
            background: transparent;
        }
        .logo img { width: 280px; height: auto; display: block; }
        .wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }
        .action-bar { display: flex; justify-content: flex-end; margin-bottom: -10px; }
        .back-link {
            text-decoration: none;
            color: #ff0000;
            font-size: 1.1rem;
            font-weight: 700;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .back-link:hover { color: #ff6666; }
        .request-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .request-card h1 { margin-top: 0; color: var(--text); }
        .request-card p.subtitle { color: var(--text-sec); margin-bottom: 1.5rem; }
        .logo img.site-logo { height: auto; width: 220px; margin-left: 0; }
        .back-link { display: inline-block; padding: 8px 6px; user-select: none; -webkit-user-select: none; transition: transform .2s ease, color .2s ease; }
        .back-link:hover { transform: translateY(-3px) scale(1.06); color: #ff6666; }
        .back-link:active { transform: translateY(0) scale(.98); }
        .logo a { display: inline-block; user-select: none; -webkit-user-select: none; transition: transform .2s ease; }
        .logo a:hover { transform: translateY(-3px) scale(1.04); }
        .logo img { -webkit-user-drag: none; user-drag: none; }
        .request-card h1 { font-size: 2rem; line-height: 1.2; }
        .header { pointer-events: none; }
        .header .logo a { pointer-events: auto; }
        .action-bar { position: relative; z-index: 5; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html">
                <img src="assets/logo.png" alt="Internationals" class="site-logo">
            </a>
        </div>
    </header>
    <div class="wrapper">
        <div class="action-bar">
            <a href="index.html" class="back-link">&larr; Internationals</a>
        </div>
        <div class="request-card">
            <h1 data-translate="request_title">Request a Translation</h1>
            <p class="subtitle" data-translate="request_subtitle">Tell us what you need — we'll get back to you shortly.</p>
            <form id="contactForm" action="https://formsubmit.co/mailtomorrow@yandex.com" method="POST" enctype="multipart/form-data">
                <input type="hidden" name="_subject" value="Request from internationals.click">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" value="https://internationals.click/request.html?sent=1">
                <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
                <div class="form-group"><input type="email" id="email" name="email" data-translate-placeholder="form_email" placeholder="Email" required></div>
                <div class="form-group"><input type="text" id="subject" name="subject" data-translate-placeholder="form_subject" placeholder="Subject" required></div>
                <div class="form-group"><textarea id="message" name="message" data-translate-placeholder="form_message" placeholder="Your message" rows="5" required></textarea></div>
                <div class="form-group"><input type="file" id="attachment" name="attachment" multiple></div>
                <button type="submit" class="btn btn-primary btn-full" data-translate="form_submit">Send message</button>
            </form>
        </div>
    </div>
  <script src="translations.js"></script>
  <script>
    const supportedLangs = ['en','ru','de','es','pt','zh','ar','fr','kk','uz','tg','az','ja','ko','hi','tr','it','id','ms','vi','pl','nl','cs','sv','fa','fi','ne','bg','sr','hy','ka','et','lv','mn','ky'];
    let userLang = navigator.language || navigator.userLanguage;
    userLang = (userLang || 'en').split('-')[0];
    const lang = localStorage.getItem('language') || (supportedLangs.includes(userLang) ? userLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-translate]').forEach(el => {
      const key = el.dataset.translate;
      if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
    });
    document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
      const key = el.dataset.translatePlaceholder;
      if (translations[lang] && translations[lang][key]) el.placeholder = translations[lang][key];
    });
  </script>
  <script>
  (function () {
    var ru = (document.documentElement.lang || 'en').slice(0, 2) === 'ru';
    var form = document.getElementById('contactForm');
    var btn = form.querySelector('button[type="submit"]');
    var box = document.createElement('div');
    box.style.cssText = 'margin-top:.8rem;font-size:.95rem;line-height:1.5;';
    form.appendChild(box);
    function say(text, ok) { box.textContent = text; box.style.color = ok ? '#15803d' : '#b91c1c'; }

    // Back links: close this tab (returns to the first tab); if it cannot be closed, go to the main page.
    function goBack(e) {
      e.preventDefault();
      if (window.opener && !window.opener.closed) {
        window.close();
        setTimeout(function () { location.href = 'index.html'; }, 250);
      } else {
        location.href = 'index.html';
      }
    }
    Array.prototype.forEach.call(document.querySelectorAll('a[href="index.html"]'), function (a) {
      a.addEventListener('click', goBack);
    });

    // Submit into a hidden frame so that this page stays where it is.
    var frame = document.createElement('iframe');
    frame.name = 'fs_frame';
    frame.style.cssText = 'display:none;width:0;height:0;border:0;';
    document.body.appendChild(frame);
    form.target = 'fs_frame';
    var sending = false;

    frame.addEventListener('load', function () {
      if (!sending) return;
      sending = false;
      btn.disabled = false;
      var ok = false;
      try { ok = /[?&]sent=1/.test(frame.contentWindow.location.search); } catch (err) { ok = false; }
      if (ok) {
        say(ru ? 'Сообщение отправлено. Мы скоро свяжемся с вами. Эту вкладку можно закрыть.' : 'Message sent. We will contact you shortly. You can close this tab.', true);
        form.reset();
      } else {
        say(ru ? 'Не удалось подтвердить отправку. Напишите нам на mailtomorrow@yandex.com' : 'Could not confirm sending. Please email us at mailtomorrow@yandex.com', false);
      }
    });

    form.addEventListener('submit', function (e) {
      var f = document.getElementById('attachment').files, total = 0;
      for (var i = 0; i < f.length; i++) total += f[i].size;
      if (total > 9.5 * 1024 * 1024) {
        e.preventDefault();
        say(ru ? 'Файлы слишком большие (до 9,5 МБ в сумме).' : 'Files are too large (9.5 MB total max).', false);
        return;
      }
      sending = true;
      btn.disabled = true;
      say(ru ? 'Отправляем...' : 'Sending...', true);
    });
  })();
  </script>
</body>
</html>
