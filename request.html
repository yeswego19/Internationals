<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Translation | Internationals</title>
    <meta name="description" content="Send us your translation request — email, subject, message and attachments.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.7">
    <style>
        body { background-color: #f4f7f9; }
        .header {
            padding: 40px 40px 10px 40px;
            display: flex;
            align-items: center;
            background: transparent;
        }
        .logo img { width: 280px; height: auto; display: block; }
        .wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }
        .action-bar { display: flex; justify-content: flex-end; margin-bottom: -10px; }
        .back-link {
            text-decoration: none;
            color: #ff0000;
            font-size: 1.1rem;
            font-weight: 700;
            transition: color 0.3s ease;
            cursor: pointer;
        }
        .back-link:hover { color: #ff6666; }
        .request-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .request-card h1 { margin-top: 0; color: var(--text); }
        .request-card p.subtitle { color: var(--text-sec); margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html" onclick="window.close();setTimeout(function(){window.location.href='index.html';},300);return false;">
                <img src="assets/logo.png" alt="Internationals" class="site-logo">
            </a>
        </div>
    </header>
    <div class="wrapper">
        <div class="action-bar">
            <a href="index.html" onclick="window.close();setTimeout(function(){window.location.href='index.html';},300);return false;" class="back-link">&larr; Internationals</a>
        </div>
        <div class="request-card">
            <h1 data-translate="request_title">Request a Translation</h1>
            <p class="subtitle" data-translate="request_subtitle">Tell us what you need — we'll get back to you shortly.</p>
            <form id="contactForm" enctype="multipart/form-data">
                <div class="form-group"><input type="email" id="email" data-translate-placeholder="form_email" placeholder="Email" required></div>
                <div class="form-group"><input type="text" id="subject" data-translate-placeholder="form_subject" placeholder="Subject" required></div>
                <div class="form-group"><textarea id="message" data-translate-placeholder="form_message" placeholder="Your message" rows="5" required></textarea></div>
                <div class="form-group"><input type="file" id="attachment" multiple></div>
                <button type="submit" class="btn btn-primary btn-full" data-translate="form_submit">Send message</button>
            </form>
        </div>
    </div>
  <script src="translations.js"></script>
  <script>
    const supportedLangs = ['en','ru','de','es','pt','zh','ar','fr','kk','uz','tg','az','ja','ko','hi','tr','it','id','ms','vi','pl','nl','cs','sv','fa','fi','ne','bg','sr','hy','ka','et','lv','mn','ky'];
    let userLang = navigator.language || navigator.userLanguage;
    userLang = (userLang || 'en').split('-')[0];
    const lang = localStorage.getItem('language') || (supportedLangs.includes(userLang) ? userLang : 'en');
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-translate]').forEach(el => {
      const key = el.dataset.translate;
      if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
    });
    document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
      const key = el.dataset.translatePlaceholder;
      if (translations[lang] && translations[lang][key]) el.placeholder = translations[lang][key];
    });
  </script>
</body>
</html>
