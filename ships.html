<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Ship Tracker | Internationals</title>
    <meta name="description" content="Live ship tracking map — see vessels around the world in real time.">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    <meta name="theme-color" content="#0B2D60">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003580;
            --hover-color: #ff0000;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
            background-color: #f4f7f9;
        }
        .header {
            padding: 40px 40px 10px 40px;
            display: flex;
            align-items: center;
            background: transparent;
        }
        .logo img {
            width: 280px;
            height: auto;
            display: block;
        }
        .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 75px;
            font-weight: bold;
            transition: color 0.3s ease;
            line-height: 0.8;
            cursor: pointer;
        }
        .back-link:hover {
            color: var(--hover-color);
        }
        .widget-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }
        .widget-container iframe {
            width: 100%;
            height: 600px;
            border: 0;
            border-radius: 10px;
            display: block;
        }
        .cta-box {
            margin-top: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            padding: 25px 30px;
            text-align: center;
        }
        .cta-box h3 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 1.2em;
        }
        .cta-box p {
            margin: 0 0 16px 0;
            color: #555;
            font-size: 0.98em;
        }
        .cta-box a.cta-btn {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .cta-box a.cta-btn:hover {
            background: var(--hover-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html" onclick="window.close();setTimeout(function(){window.location.href='index.html';},300);return false;">
                <img src="assets/logo.png" alt="Internationals" class="site-logo">
            </a>
        </div>
    </header>
    <div class="wrapper">
        <div class="action-bar">
            <a onclick="window.close();" class="back-link" title="Закрыть и вернуться">&larr;</a>
        </div>
        <div class="widget-container">
            <iframe scrolling="no" src="https://www.marinetraffic.com/en/ais/embed/zoom:4/centery:35.0/centerx:20.0/maptype:0/shownames:false/mmsi:0/shipid:0/fleet:/fleet_id:/vtypes:/showmenu:true/remember:false" title="Live ship tracking map"></iframe>
        </div>
        <div class="cta-box">
            <h3>Shipping documents to translate?</h3>
            <p>Bills of lading, customs declarations, crew contracts, certificates of origin — we translate maritime and logistics paperwork accurately and fast.</p>
            <a href="feedback.html" target="feedback_tab" class="cta-btn">Get a translation quote</a>
        </div>
    </div>
</body>
</html>
