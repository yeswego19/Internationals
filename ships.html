<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="canonical" href="https://internationalspro.ru/ships.html">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Ship Tracker | Internationals</title>
    <meta name="description" content="Live ship tracking map — see vessels around the world in real time.">
    <link rel="icon" href="/assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    <meta name="theme-color" content="#0B2D60">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #003580;
            --hover-color: #ff0000;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', Arial, sans-serif;
            background-color: #f4f7f9;
        }
        .header {
            padding: 40px 40px 10px 40px;
            display: flex;
            align-items: center;
            background: transparent;
        }
        .logo img {
            width: 280px;
            height: auto;
            display: block;
        }
        .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            box-sizing: border-box;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -10px;
        }
        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-size: 75px;
            font-weight: bold;
            transition: color 0.3s ease;
            line-height: 0.8;
            cursor: pointer;
        }
        .back-link:hover {
            color: var(--hover-color);
        }
        .widget-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }
        .widget-container iframe {
            width: 100%;
            height: 600px;
            border: 0;
            border-radius: 10px;
            display: block;
        }
        .cta-box {
            margin-top: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            padding: 25px 30px;
            text-align: center;
        }
        .cta-box h3 {
            margin: 0 0 8px 0;
            color: var(--primary-color);
            font-size: 1.2em;
        }
        .cta-box p {
            margin: 0 0 16px 0;
            color: #555;
            font-size: 0.98em;
        }
        .cta-box a.cta-btn {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .cta-box a.cta-btn:hover {
            background: var(--hover-color);
        }
        .volume-control{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:9998;display:flex;flex-direction:column;align-items:center;gap:8px}
        .volume-slider-container{position:relative;width:4px;height:150px;background:rgba(0,0,0,0.15);border-radius:2px;backdrop-filter:blur(10px)}
        .volume-slider{-webkit-appearance:none;appearance:none;width:150px;height:4px;background:transparent;transform:rotate(-90deg);position:absolute;top:50%;left:50%;margin-left:-75px;cursor:pointer}
        .volume-fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,#0066ff,#4a9eff);border-radius:2px;transition:height 0.1s;pointer-events:none}
        .volume-icon{font-size:18px;color:rgba(0,0,0,0.55)}
        .mute-toggle-btn{background:rgba(0,0,0,0.08);border:none;color:#1f2937;cursor:pointer;font-size:15px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease}
        .mute-toggle-btn:hover{background:rgba(0,0,0,0.16);transform:scale(1.08)}
        @media (max-width:768px){
          .volume-control{right:4px;top:60%;transform:translateY(-50%)}
          .volume-slider-container{height:120px}
          .volume-slider{width:120px;margin-left:-60px}
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <audio id="bgMusic" preload="metadata" loop></audio>
    <div class="volume-control">
        <i class="fas fa-volume-up volume-icon"></i>
        <div class="volume-slider-container">
            <div class="volume-fill" id="volumeFill"></div>
            <input type="range" min="0" max="100" value="30" class="volume-slider" id="volumeSlider">
        </div>
        <i class="fas fa-volume-down volume-icon"></i>
        <button type="button" id="muteToggle" class="mute-toggle-btn" title="Выключить музыку" aria-label="Выключить музыку"><i class="fas fa-volume-mute" id="muteIcon"></i></button>
    </div>
    <header class="header">
        <div class="logo">
            <a href="index.html" onclick="window.close();setTimeout(function(){window.location.href='index.html';},300);return false;">
                <img src="assets/logo.png" alt="Internationals" class="site-logo">
            </a>
        </div>
    </header>
    <div class="wrapper">
        <div class="action-bar">
            <a onclick="window.close();" class="back-link" title="Закрыть и вернуться">&larr;</a>
        </div>
        <div class="widget-container">
            <iframe scrolling="no" src="https://www.marinetraffic.com/en/ais/embed/zoom:4/centery:35.0/centerx:20.0/maptype:0/shownames:false/mmsi:0/shipid:0/fleet:/fleet_id:/vtypes:/showmenu:true/remember:false" title="Live ship tracking map"></iframe>
        </div>
        <div class="cta-box">
            <h3>Shipping documents to translate?</h3>
            <p>Bills of lading, customs declarations, crew contracts, certificates of origin — we translate maritime and logistics paperwork accurately and fast.</p>
            <a href="feedback.html" target="feedback_tab" class="cta-btn">Get a translation quote</a>
        </div>
    </div>
<script>
(function(){
  var audio = document.getElementById('bgMusic');
  var volumeSlider = document.getElementById('volumeSlider');
  var volumeFill = document.getElementById('volumeFill');
  var muteBtn = document.getElementById('muteToggle');
  var muteIcon = document.getElementById('muteIcon');
  var canPlay = false;
  var musicMuted = localStorage.getItem('musicMuted') === 'true';

  volumeSlider.addEventListener('input', function() {
    var volume = this.value / 100;
    audio.volume = volume;
    volumeFill.style.height = this.value + '%';
    localStorage.setItem('musicVolume', volume);
  });

  var savedVolume = localStorage.getItem('musicVolume');
  if (savedVolume !== null) {
    var volumePercent = Math.round(savedVolume * 100);
    volumeSlider.value = volumePercent;
    volumeFill.style.height = volumePercent + '%';
    audio.volume = savedVolume;
  } else {
    volumeFill.style.height = '30%';
  }

  var volumeContainer = document.querySelector('.volume-slider-container');
  volumeContainer.addEventListener('click', function(e) {
    var rect = this.getBoundingClientRect();
    var y = e.clientY - rect.top;
    var percent = Math.max(0, Math.min(100, 100 - (y / rect.height * 100)));
    volumeSlider.value = percent;
    audio.volume = percent / 100;
    volumeFill.style.height = percent + '%';
    localStorage.setItem('musicVolume', percent / 100);
  });
  volumeContainer.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var rect = this.getBoundingClientRect();
    var touch = e.touches[0];
    var y = touch.clientY - rect.top;
    var percent = Math.max(0, Math.min(100, 100 - (y / rect.height * 100)));
    volumeSlider.value = percent;
    audio.volume = percent / 100;
    volumeFill.style.height = percent + '%';
    localStorage.setItem('musicVolume', percent / 100);
  });

  function updateMuteIcon() {
    muteIcon.className = musicMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
    muteBtn.title = musicMuted ? 'Включить музыку' : 'Выключить музыку';
  }
  updateMuteIcon();

  muteBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    musicMuted = !musicMuted;
    localStorage.setItem('musicMuted', musicMuted ? 'true' : 'false');
    if (musicMuted) {
      audio.pause();
    } else {
      canPlay = true;
      if (!audio.src) audio.src = 'Calli.mp3';
      audio.volume = volumeSlider.value / 100;
      audio.play().catch(function(){});
    }
    updateMuteIcon();
  });

  window.addEventListener('storage', function(e) {
    if (e.key === 'musicMuted') {
      musicMuted = e.newValue === 'true';
      if (musicMuted) { audio.pause(); } else { audio.play().catch(function(){}); }
      updateMuteIcon();
    }
  });

  document.body.addEventListener('click', function() {
    if (canPlay) return;
    canPlay = true;
    if (musicMuted) return;
    audio.src = 'Calli.mp3';
    audio.volume = volumeSlider.value / 100;
    audio.play().catch(function(){});
  }, { once: true });
})();
</script>
</body>
</html>
